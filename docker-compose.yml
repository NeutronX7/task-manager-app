services:
  mysql:
    image: mysql:8.0
    container_name: manager_mysql
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_USER: manager
      MYSQL_PASSWORD: manager_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manager_backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html

volumes:
  mysql_data:
